services:
  stats-db:
    image: postgres:16.1
    environment:
      POSTGRES_DB: stats
      POSTGRES_USER: stats
      POSTGRES_PASSWORD: stats
    ports:
      - "6542:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U stats -d stats" ]
      interval: 5s
      timeout: 3s
      retries: 20

  stats-server:
    build:
      context: ./stats-service/stats-server
    depends_on:
      stats-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://stats-db:5432/stats
      SPRING_DATASOURCE_USERNAME: stats
      SPRING_DATASOURCE_PASSWORD: stats

  ewm-service:
    build:
      context: ./main-service
    depends_on: [ stats-server ]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://ewm-db:6543/main-service
      SPRING_DATASOURCE_USERNAME: main
      SPRING_DATASOURCE_PASSWORD: main
      STATS_BASE_URL: http://stats-server:9090
    ports:
      - "8080:8080"